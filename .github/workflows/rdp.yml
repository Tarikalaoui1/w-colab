name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Install Ngrok via Choco
        run: choco install ngrok -y
      - name: Authenticate Ngrok
        run: ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
      - name: Enable RDP and Set Password
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user Administrator User#123456 /add
          net localgroup Administrators Administrator /add
      - name: Start Ngrok and Print Connection Details
        run: |
          Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389" -NoNewWindow
          
          $timeout = 30
          $public_url = $null
          while ($timeout -gt 0) {
            try {
              $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
              if ($response.tunnels.count -gt 0) {
                $public_url = $response.tunnels[0].public_url
                break
              }
            } catch {
              Start-Sleep -Seconds 3
              $timeout -= 3
            }
          }

          if ($public_url) {
            Write-Host "=========================================="
            Write-Host "RDP Address: $public_url"
            Write-Host "Username: Administrator"
            Write-Host "Password: User#123456"
            Write-Host "=========================================="
          } else {
            Write-Error "Failed to retrieve Ngrok tunnel URL."
            exit 1
          }
      - name: Keep Alive
        run: Start-Sleep -Seconds 21600
