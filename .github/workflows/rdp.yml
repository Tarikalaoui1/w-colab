name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable RDP and Set Password
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user Administrator User#123456 /add
          net localgroup Administrators Administrator /add
      - name: Start Serveo TCP Tunnel
        run: |
          # Serveo va ouvrir un port TCP distant et afficher l'adresse exacte (ex: serveo.net:XXXXX)
          ssh -o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net
      - name: Keep Alive
        run: Start-Sleep -Seconds 21600
