name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable RDP and Set Password
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user Administrator User#123456 /add
          net localgroup Administrators Administrator /add
      - name: Start Pinggy Tunnel (TCP)
        run: |
          Start-Process powershell -ArgumentList '-NoExit', '-Command', 'ssh -p 443 -R0:localhost:3389 a.pinggy.io'
      - name: Print Connection Details
        run: |
          Write-Host "=========================================="
          Write-Host "Utilisez l'adresse SSH de Pinggy qui va s'afficher ou connectez-vous via le tunnel TCP"
          Write-Host "Username: Administrator"
          Write-Host "Password: User#123456"
          Write-Host "=========================================="
          Start-Sleep -Seconds 21600
