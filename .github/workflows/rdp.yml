name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Install Ngrok via Choco
        run: choco install ngrok -y
      - name: Authenticate Ngrok
        run: ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
      - name: Enable RDP and Set Password
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user Administrator User#123456 /add
          net localgroup Administrators Administrator /add
      - name: Start Ngrok Tunnel
        run: Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389"
      - name: Print Connection Details
        run: |
          Start-Sleep -Seconds 5
          $tunnel = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
          $public_url = $tunnel.tunnels[0].public_url
          Write-Output "=========================================="
          Write-Output "RDP Address: $public_url"
          Write-Output "Username: Administrator"
          Write-Output "Password: User#123456"
          Write-Output "=========================================="
      - name: Keep Alive
        run: Start-Sleep -Seconds 21600
