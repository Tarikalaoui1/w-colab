name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download and Setup Ngrok
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyA1xQ3vtT/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip" -ErrorAction SilentlyContinue
          Expand-Archive ngrok.zip -DestinationPath . -Force
          if (!(Test-Path "ngrok.exe")) {
            Invoke-WebRequest -Uri "https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-windows-amd64.zip" -OutFile "ngrok.zip"
            Expand-Archive ngrok.zip -DestinationPath . -Force
          }
      - name: Authenticate Ngrok
        run: .\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
      - name: Enable RDP and Set Password
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user Administrator User#123456 /add
          net localgroup Administrators Administrator /add
      - name: Start Ngrok Tunnel
        run: Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389"
      - name: Print Connection Details
        run: |
          Start-Sleep -Seconds 3
          $tunnel = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
          $public_url = $tunnel.tunnels[0].public_url
          Write-Output "=========================================="
          Write-Output "RDP Address: $public_url"
          Write-Output "Username: Administrator"
          Write-Output "Password: User#123456"
          Write-Output "=========================================="
      - name: Keep Alive
        run: Start-Sleep -Seconds 21600
